<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaletCD Pro - Firebase Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
  <div id="app"></div>

  <script type="module">
    // Firebase Configuration
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, get, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9qVsBjf_v59TN8Ayvarts5Q7LXxzlVrQ",
      authDomain: "paletcd.firebaseapp.com",
      databaseURL: "https://paletcd-default-rtdb.firebaseio.com",
      projectId: "paletcd",
      storageBucket: "paletcd.firebasestorage.app",
      messagingSenderId: "431517046970",
      appId: "1:431517046970:web:e03e0ff01e1b898275ca83"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ============== ESTADO GLOBAL ==============
    let S = {
      est: {},
      movs: [],
      triagens: [],
      reformas: [],
      solics: [],
      forns: [],
      recebForn: [],
      fornNomes: {}
    };

    let _user = null;
    let _firebaseReady = false;
    let _syncInProgress = false;

    // ============== FIREBASE SYNC ==============
    async function firebaseLoad() {
      try {
        console.log("🔄 Carregando dados do Firebase...");
        const snapshot = await get(ref(db, "paletcd"));
        
        if (snapshot.exists()) {
          S = snapshot.val();
          console.log("✅ Dados carregados do Firebase:", S);
          return true;
        } else {
          console.log("ℹ️ Firebase vazio - usando localStorage");
          return false;
        }
      } catch (e) {
        console.error("❌ Erro ao carregar Firebase:", e);
        return false;
      }
    }

    async function firebaseSave() {
      if (_syncInProgress) return;
      _syncInProgress = true;

      try {
        console.log("📤 Sincronizando com Firebase...");
        await set(ref(db, "paletcd"), S);
        console.log("✅ Dados sincronizados com Firebase");
        _syncInProgress = false;
        return true;
      } catch (e) {
        console.error("❌ Erro ao sincronizar Firebase:", e);
        _syncInProgress = false;
        return false;
      }
    }

    // Sincronização em tempo real
    onValue(ref(db, "paletcd"), (snapshot) => {
      if (snapshot.exists() && !_syncInProgress) {
        const remoteData = snapshot.val();
        // Merge inteligente - usar dados remotos mais novos
        if (JSON.stringify(S) !== JSON.stringify(remoteData)) {
          S = remoteData;
          console.log("🔄 Dados sincronizados de outro dispositivo");
          renderUI();
        }
      }
    });

    // ============== STORAGE LOCAL ==============
    function loadFromStorage() {
      const stored = localStorage.getItem("paletcd_data");
      if (stored) {
        try {
          S = JSON.parse(stored);
          console.log("📂 Dados carregados de localStorage");
          return true;
        } catch (e) {
          console.error("Erro ao carregar localStorage:", e);
          return false;
        }
      }
      return false;
    }

    function saveToStorage() {
      localStorage.setItem("paletcd_data", JSON.stringify(S));
    }

    // ============== FUNCIONALIDADES ==============
    function login(area, senha) {
      const areas = {
        "ADM": "ADM@2024",
        "REV": "REV@2024",
        "MER": "MER@2024",
        "FLV": "FLV@2024",
        "PER": "PER@2024",
        "PRD": "PRD@2024",
        "CFR": "CFR@2024",
        "FRI": "FRI@2024"
      };

      if (areas[area] === senha) {
        _user = area;
        renderUI();
        return true;
      }
      return false;
    }

    function registrarMovimento(tipo, origem, destino, modelos, usuario) {
      const id = "MOV-" + (Math.max(0, ...S.movs.map(m => parseInt(m.id.split("-")[1]) || 0)) + 1).toString().padStart(5, "0");
      
      const mov = {
        id,
        tipo,
        origem,
        destino,
        qtd: Object.values(modelos).reduce((a, b) => a + b, 0),
        modelos,
        usuario,
        obs: "",
        ts: new Date().toLocaleString("pt-BR"),
        nf: ""
      };

      S.movs.push(mov);
      updateEstoque();
      saveToStorage();
      firebaseSave();
      
      return id;
    }

    function updateEstoque() {
      // Recalcular estoque a partir do histórico
      S.est = {};
      
      // Inicializar locais
      const locais = ["REV", "Mercearia", "FLV", "Perecível", "Produção", "Central de Frios", "Frigorífico"];
      const modelos = ["PBR", "DESCARTAVEL", "CHEP", "EURO", "CHEP_EURO", "GAIOLA"];
      
      locais.forEach(local => {
        S.est[local] = {};
        modelos.forEach(modelo => {
          S.est[local][modelo] = 0;
        });
      });

      // Processar movimentos
      S.movs.forEach(mov => {
        if (mov.origem && S.est[mov.origem]) {
          Object.entries(mov.modelos).forEach(([modelo, qty]) => {
            S.est[mov.origem][modelo] = (S.est[mov.origem][modelo] || 0) - qty;
          });
        }
        if (mov.destino && S.est[mov.destino]) {
          Object.entries(mov.modelos).forEach(([modelo, qty]) => {
            S.est[mov.destino][modelo] = (S.est[mov.destino][modelo] || 0) + qty;
          });
        }
      });
    }

    function exportBackup() {
      const json = JSON.stringify(S, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `paletcd_backup_${new Date().toISOString().split("T")[0]}.json`;
      a.click();
    }

    function importBackup(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          S = JSON.parse(e.target.result);
          saveToStorage();
          firebaseSave();
          renderUI();
          alert("✅ Backup importado com sucesso!");
        } catch (err) {
          alert("❌ Erro ao importar backup: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    // ============== UI ==============
    function renderUI() {
      const app = document.getElementById("app");

      if (!_user) {
        app.innerHTML = `
          <div class="min-h-screen bg-blue-600 flex items-center justify-center">
            <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
              <h1 class="text-3xl font-bold text-center mb-6">PaletCD Pro</h1>
              <p class="text-center text-gray-600 mb-6">Firebase Edition</p>
              
              <div class="space-y-4">
                <select id="area" class="w-full p-2 border rounded">
                  <option value="">Selecione a área</option>
                  <option value="ADM">Administrador</option>
                  <option value="REV">Logística Reversa</option>
                  <option value="MER">Mercearia</option>
                  <option value="FLV">FLV</option>
                  <option value="PER">Perecível</option>
                  <option value="PRD">Produção</option>
                  <option value="CFR">Central de Frios</option>
                  <option value="FRI">Frigorífico</option>
                </select>
                
                <input type="password" id="senha" placeholder="Senha" class="w-full p-2 border rounded">
                
                <button onclick="fazerLogin()" class="w-full bg-blue-600 text-white p-2 rounded font-bold">
                  Entrar
                </button>
              </div>
            </div>
          </div>
        `;

        window.fazerLogin = () => {
          const area = document.getElementById("area").value;
          const senha = document.getElementById("senha").value;
          if (login(area, senha)) {
            renderUI();
          } else {
            alert("❌ Área ou senha inválida");
          }
        };

        return;
      }

      // Dashboard principal
      app.innerHTML = `
        <div class="min-h-screen bg-gray-100">
          <!-- Topbar -->
          <div class="bg-blue-600 text-white p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">PaletCD Pro 🚀</h1>
            <div class="flex gap-4 items-center">
              <span>Usuário: <strong>${_user}</strong></span>
              <span id="sync-status">🟢 Online</span>
              <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded">Sair</button>
            </div>
          </div>

          <!-- Main Content -->
          <div class="p-6">
            <div class="grid grid-cols-4 gap-4 mb-6">
              <div class="bg-white p-4 rounded shadow">
                <p class="text-gray-600">Total Movimentos</p>
                <p class="text-3xl font-bold">${S.movs.length}</p>
              </div>
              <div class="bg-white p-4 rounded shadow">
                <p class="text-gray-600">Últimos 7 dias</p>
                <p class="text-3xl font-bold">${S.movs.filter(m => {
                  const d = new Date(m.ts);
                  return (new Date() - d) < 7 * 24 * 60 * 60 * 1000;
                }).length}</p>
              </div>
              <div class="bg-white p-4 rounded shadow">
                <p class="text-gray-600">Firebase</p>
                <p class="text-3xl font-bold text-green-600">✅</p>
              </div>
              <div class="bg-white p-4 rounded shadow">
                <p class="text-gray-600">Status</p>
                <p class="text-3xl font-bold text-blue-600">Ativo</p>
              </div>
            </div>

            <!-- Abas -->
            <div class="bg-white rounded shadow p-6">
              <div class="flex gap-4 mb-6 border-b">
                <button onclick="tabAtiva='movs'" class="px-4 py-2 border-b-2 border-blue-600">
                  📊 Movimentações
                </button>
                <button onclick="tabAtiva='config'" class="px-4 py-2">
                  ⚙️ Configurações
                </button>
              </div>

              <!-- Tab: Movimentações -->
              <div id="tab-movs" class="hidden">
                <div class="mb-6">
                  <button onclick="abrirNovaMovimentacao()" class="bg-green-600 text-white px-4 py-2 rounded font-bold">
                    ➕ Nova Movimentação
                  </button>
                </div>

                <table class="w-full border-collapse border border-gray-300">
                  <thead class="bg-gray-200">
                    <tr>
                      <th class="border p-2 text-left">ID</th>
                      <th class="border p-2 text-left">Tipo</th>
                      <th class="border p-2 text-left">Origem</th>
                      <th class="border p-2 text-left">Destino</th>
                      <th class="border p-2 text-left">Qtd</th>
                      <th class="border p-2 text-left">Data/Hora</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${S.movs.slice().reverse().map(m => `
                      <tr class="hover:bg-gray-100">
                        <td class="border p-2">${m.id}</td>
                        <td class="border p-2">${m.tipo}</td>
                        <td class="border p-2">${m.origem || "-"}</td>
                        <td class="border p-2">${m.destino || "-"}</td>
                        <td class="border p-2">${m.qtd}</td>
                        <td class="border p-2">${m.ts}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>

              <!-- Tab: Configurações -->
              <div id="tab-config" class="hidden">
                <div class="space-y-4">
                  <button onclick="exportBackup()" class="w-full bg-blue-600 text-white p-3 rounded font-bold">
                    📥 Exportar Backup (JSON)
                  </button>
                  
                  <label class="w-full bg-green-600 text-white p-3 rounded font-bold cursor-pointer block text-center">
                    📤 Importar Backup (JSON)
                    <input type="file" accept=".json" style="display:none" onchange="if(this.files[0]) importBackup(this.files[0])">
                  </label>

                  <button onclick="forcarSincronizar()" class="w-full bg-purple-600 text-white p-3 rounded font-bold">
                    🔄 Forçar Sincronização Firebase
                  </button>

                  <button onclick="resetarDados()" class="w-full bg-red-600 text-white p-3 rounded font-bold">
                    🗑️ Apagar Todos os Dados
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      // Mostrar/esconder abas
      const tab = window.tabAtiva || "movs";
      document.getElementById(`tab-${tab}`)?.classList.remove("hidden");

      window.logout = () => {
        _user = null;
        renderUI();
      };

      window.abrirNovaMovimentacao = () => {
        const tipo = prompt("Tipo de movimento:");
        if (!tipo) return;
        const origem = prompt("Origem:");
        if (!origem) return;
        const destino = prompt("Destino:");
        if (!destino) return;
        const qtd = parseInt(prompt("Quantidade:"));
        if (!qtd) return;
        
        const modelos = { PBR: qtd }; // Simplificado
        
        const id = registrarMovimento(tipo, origem, destino, modelos, _user);
        alert(`✅ Movimento ${id} registrado!`);
        renderUI();
      };

      window.forcarSincronizar = async () => {
        await firebaseSave();
        alert("✅ Sincronização completa!");
      };

      window.resetarDados = () => {
        if (confirm("⚠️ Tem certeza? Vai apagar TUDO!")) {
          S = { est: {}, movs: [], triagens: [], reformas: [], solics: [], forns: [], recebForn: [], fornNomes: {} };
          saveToStorage();
          firebaseSave();
          renderUI();
          alert("🗑️ Dados apagados");
        }
      };
    }

    // ============== INIT ==============
    async function init() {
      console.log("🚀 PaletCD Pro - Firebase Edition");
      
      // 1. Carregar do localStorage
      loadFromStorage();
      
      // 2. Tentar carregar do Firebase
      const hasFirebase = await firebaseLoad();
      
      // 3. Render UI
      renderUI();
      
      console.log("✅ App pronto!");
    }

    window.exportBackup = exportBackup;
    window.importBackup = importBackup;

    init();
  </script>
</body>
</html>
