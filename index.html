<style>
:root{
  --navy:#0052CC;--navy-dark:#003DBB;--navy-light:#0066FF;
  --teal:#00D9FF;--teal-light:#33EBFF;
  --amber:#FFB800;--red:#FF3B30;--green:#34C759;--orange:#FF9500;
  --slate-light:#5d6d7e;--purple:#9933FF;
  --bg:#f0f4f8;--bg-card:#fff;
  --border:#d5e8f5;--border-dark:#aecfe8;
  --text:#1a252f;--text-mid:#34495e;--text-light:#6c8093;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --radius:10px;--radius-sm:6px;
  --shadow:0 2px 12px rgba(27,79,114,.10);--shadow-md:0 4px 24px rgba(27,79,114,.15);
  --sidebar-w:240px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* ── LOGIN ────────────────────────────── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0052CC 0%,#9933FF 100%);padding:20px;}
.login-box{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.login-logo{text-align:center;margin-bottom:22px;}
.login-logo-icon{font-size:46px;}
.login-logo-title{font-size:23px;font-weight:700;color:var(--navy);margin-top:5px;}
.login-logo-sub{font-size:11px;color:var(--text-light);letter-spacing:1.5px;text-transform:uppercase;}
.login-tabs{display:flex;margin-bottom:20px;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--border-dark);}
.login-tab{flex:1;padding:9px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-light);background:#f8fbff;transition:all .15s;}
.login-tab.active{background:var(--navy);color:#fff;}
.login-section{margin-bottom:14px;}
.login-label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-light);margin-bottom:5px;}
.login-select,.login-input{width:100%;background:#f8fbff;border:1.5px solid var(--border-dark);border-radius:var(--radius-sm);color:var(--text);padding:10px 13px;font-family:var(--font);font-size:14px;outline:none;transition:border-color .15s;}
.login-select:focus,.login-input:focus{border-color:var(--navy);}
.login-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s;}
.login-btn:hover{background:var(--navy-dark);}
.login-error{background:#fadbd8;border:1px solid #e74c3c;border-radius:var(--radius-sm);padding:10px 13px;color:#922b21;font-size:12px;margin-top:10px;display:none;}

/* ── SYNC STATUS ────────────────────── */
.sync-badge{position:fixed;bottom:20px;right:20px;background:#fff;border-radius:8px;padding:10px 14px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:300;display:flex;align-items:center;gap:8px;font-weight:600;}
.sync-badge.synced{color:var(--green);border:1px solid var(--green);}
.sync-badge.syncing{color:var(--navy);border:1px solid var(--navy);}
.sync-badge.error{color:var(--red);border:1px solid var(--red);}
.sync-indicator{width:8px;height:8px;border-radius:50%;animation:pulse 2s infinite;}
.sync-badge.synced .sync-indicator{background:var(--green);}
.sync-badge.syncing .sync-indicator{background:var(--navy);animation:pulse 1s infinite;}
.sync-badge.error .sync-indicator{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ── SENHAS INFO BOX ──────────────────── */
.pwd-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;}
.pwd-table td{padding:3px 6px;border-bottom:1px solid var(--border);}
.pwd-table td:first-child{color:var(--navy);font-weight:600;}
.pwd-table td:last-child{font-family:var(--mono);color:var(--teal);font-weight:700;letter-spacing:1px;}

/* ── APP ──────────────────────────────── */
#app-shell{display:none;}
.sidebar{width:var(--sidebar-w);background:#0052CC;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sidebar-top{padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.12);}
.sidebar-logo{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;}
.sidebar-logo-sub{font-size:9px;color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.sidebar-user{margin-top:10px;background:rgba(255,255,255,.10);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;}
.su-icon{font-size:18px;}
.su-name{font-size:12px;font-weight:600;color:#fff;line-height:1.3;}
.su-role{font-size:9px;color:rgba(255,255,255,.5);margin-top:1px;}
.nav-group{padding:8px 0 2px;}
.nav-label{padding:5px 16px 3px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38);font-family:var(--mono);}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;color:rgba(255,255,255,.75);font-size:13px;font-weight:500;transition:all .15s;border-left:3px solid transparent;white-space:nowrap;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;border-left-color:var(--teal-light);}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;gap:6px;}
.logout-btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);border-radius:6px;padding:7px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font);transition:all .15s;text-align:center;}
.logout-btn:hover{background:rgba(255,255,255,.2);color:#fff;}
.chg-pwd-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);border-radius:6px;padding:5px;cursor:pointer;font-size:11px;font-family:var(--font);text-align:center;}
.chg-pwd-btn:hover{color:rgba(255,255,255,.8);}

/* ── MAIN ─────────────────────────────── */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--border-dark);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;align-items:center;justify-content:center;font-size:18px;color:var(--navy);flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:700;color:var(--navy);}
.topbar-sub{font-size:11px;color:var(--text-light);margin-top:1px;}
.topbar-right{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text-light);}
.content{flex:1;padding:20px 22px 80px;}

/* ── BUTTONS ──────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--navy);color:#fff;}.btn-primary:hover{background:var(--navy-dark);}
.btn-success{background:var(--green);color:#fff;}.btn-success:hover{background:#196f3d;}
.btn-warning{background:var(--amber);color:#fff;}.btn-warning:hover{background:#b8860b;}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{background:#a93226;}
.btn-ghost{background:var(--bg);border:1px solid var(--border-dark);color:var(--text-mid);}.btn-ghost:hover{background:var(--border);}
.btn-teal{background:var(--teal);color:#fff;}.btn-teal:hover{background:#117a65;}
.btn-purple{background:var(--purple);color:#fff;}.btn-purple:hover{background:#5b2c6f;}
.btn-sm{padding:5px 12px;font-size:12px;} .btn-xs{padding:3px 8px;font-size:11px;}

/* ── SCREENS ──────────────────────────── */
.screen{display:none;}
.screen.active{display:block;}

/* ── TOAST ────────────────────────────── */
.toast-container{position:fixed;top:60px;right:20px;z-index:1000;}
.toast{background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:10px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .3s ease-out;min-width:240px;}
.toast.success{border-left:4px solid var(--green);color:var(--green);}
.toast.error{border-left:4px solid var(--red);color:var(--red);}
.toast.warn{border-left:4px solid var(--amber);color:var(--amber);}
.toast.info{border-left:4px solid var(--navy);color:var(--navy);}
@keyframes slideIn{from{transform:translateX(400px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ── MOBILE ───────────────────────────── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:flex;}
  .main{margin-left:0;}
  #mob-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:150;}
  #mob-overlay.open{display:block;}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">📦</div>
      <div class="login-logo-title">PaletCD</div>
      <div class="login-logo-sub">v3 FIREBASE SYNC</div>
    </div>
    
    <div class="login-tabs">
      <div class="login-tab active" onclick="switchLoginTab('area')">Área</div>
      <div class="login-tab" onclick="switchLoginTab('loja')">Loja</div>
    </div>

    <div id="area-login" class="login-section">
      <label class="login-label">Senha Área</label>
      <input type="password" id="la-pwd" class="login-input" placeholder="">
      <button class="login-btn" onclick="loginArea()">Entrar</button>
    </div>

    <div id="loja-login" style="display:none;">
      <div class="login-section">
        <label class="login-label">Loja</label>
        <select id="ll-loja" class="login-select"></select>
      </div>
      <div class="login-section">
        <label class="login-label">Senha Loja</label>
        <input type="password" id="ll-pwd" class="login-input" placeholder="">
        <button class="login-btn" onclick="loginLoja()">Entrar</button>
      </div>
    </div>

    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">PaletCD</div>
      <div class="sidebar-logo-sub">v3 Firebase</div>
      <div class="sidebar-user">
        <div class="su-icon">👤</div>
        <div>
          <div class="su-name" id="user-name">User</div>
          <div class="su-role" id="user-role">Role</div>
        </div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Menu</div>
      <div class="nav-item active" onclick="navigate('dashboard')">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" onclick="navigate('estoque')">
        <span class="nav-icon">📦</span>
        <span>Estoque</span>
      </div>
      <div class="nav-item" onclick="navigate('movimentacoes')">
        <span class="nav-icon">↔️</span>
        <span>Movimentações</span>
      </div>
      <div class="nav-item" onclick="navigate('configuracoes')">
        <span class="nav-icon">⚙️</span>
        <span>Configurações</span>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">Sair</button>
      <button class="chg-pwd-btn" onclick="alert('Alterar senha em configurações')">Alterar Senha</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <div>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-sub" id="page-subtitle"></div>
      </div>
      <div class="topbar-right">
        <span id="top-clock">--:--:--</span>
      </div>
    </div>

    <div class="content">
      <!-- DASHBOARD -->
      <div class="screen active" id="dashboard">
        <h2>Dashboard</h2>
        <p id="sync-status" style="margin-top:10px;font-size:12px;color:var(--text-light);">Carregando...</p>
      </div>

      <!-- ESTOQUE -->
      <div class="screen" id="estoque">
        <h2>Estoque Atual</h2>
      </div>

      <!-- MOVIMENTAÇÕES -->
      <div class="screen" id="movimentacoes">
        <h2>Movimentações</h2>
      </div>

      <!-- CONFIGURAÇÕES -->
      <div class="screen" id="configuracoes">
        <h2>Configurações</h2>
        <button class="btn btn-primary" onclick="forceSyncFirebase()">Sincronizar com Firebase</button>
      </div>
    </div>
  </div>

  <div id="mob-overlay"></div>
</div>

<!-- SYNC BADGE -->
<div id="sync-badge" class="sync-badge syncing">
  <div class="sync-indicator"></div>
  <span id="sync-text">Sincronizando...</span>
</div>

<script>
// ═══════════════════════════════════════════════════════
// FIREBASE CONFIGURATION
// ═══════════════════════════════════════════════════════

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD9qVsBjf_v59TN8Ayvarts5Q7LXxzlVrQ",
  authDomain: "paletcd.firebaseapp.com",
  databaseURL: "https://paletcd-default-rtdb.firebaseio.com",
  projectId: "paletcd",
  storageBucket: "paletcd.firebasestorage.app",
  messagingSenderId: "431517046970",
  appId: "1:431517046970:web:e03e0ff01e1b898275ca83"
};

// Initialize Firebase com espera
let db = null;
let firebaseReady = false;

async function initFirebase() {
  return new Promise((resolve) => {
    // Espera Firebase estar disponível
    const checkFirebase = setInterval(() => {
      if(typeof firebase !== 'undefined') {
        clearInterval(checkFirebase);
        try {
          if(!firebase.apps.length) {
            firebase.initializeApp(FIREBASE_CONFIG);
          }
          db = firebase.database();
          firebaseReady = true;
          console.log("Firebase inicializado com sucesso");
          resolve(true);
        } catch(e) {
          console.error("Erro ao inicializar Firebase:", e);
          firebaseReady = false;
          resolve(false);
        }
      }
    }, 100);
    
    // Timeout de 5 segundos
    setTimeout(() => {
      clearInterval(checkFirebase);
      if(!firebaseReady) {
        console.warn("Firebase não inicializou em tempo");
        resolve(false);
      }
    }, 5000);
  });
}

// ═══════════════════════════════════════════════════════
// STATE & STORAGE
// ═══════════════════════════════════════════════════════

let S = {
  movs: [],
  est: {},
  user: null,
  role: null
};

const LOJAS_BASE = [
  {d: 1, n: "Sumaré SP"},
  {d: 2, n: "Cotia SP"},
  {d: 3, n: "Guarulhos SP"}
];

const SENHAS = {
  area: "area123",
  loja: "loja123"
};

// ═══════════════════════════════════════════════════════
// LOCAL STORAGE & SYNC
// ═══════════════════════════════════════════════════════

function save() {
  localStorage.setItem('palet_data', JSON.stringify(S));
  updateSyncBadge();
}

function load() {
  const stored = localStorage.getItem('palet_data');
  if(stored) {
    try {
      S = JSON.parse(stored);
    } catch(e) {
      console.error("Erro ao carregar localStorage:", e);
    }
  }
}

// Escuta mudanças de outras abas
window.addEventListener('storage', (e) => {
  if(e.key === 'palet_data' && e.newValue) {
    try {
      S = JSON.parse(e.newValue);
      renderScreen(getCurrentScreen());
      updateSyncBadge();
      toast('✓ Dados atualizados de outra aba', 'info');
    } catch(err) {
      console.error("Erro ao sincronizar entre abas:", err);
    }
  }
});

// ═══════════════════════════════════════════════════════
// FIREBASE SYNC
// ═══════════════════════════════════════════════════════

async function syncFromFirebase() {
  if(!firebaseReady || !db) {
    updateSyncBadge('error', 'Firebase não disponível');
    return false;
  }

  try {
    updateSyncBadge('syncing', 'Sincronizando...');
    
    const snapshot = await db.ref('palet_app/data').once('value');
    const remoteData = snapshot.val();
    
    if(remoteData) {
      S = { ...S, ...remoteData };
      save();
      updateSyncBadge('synced', 'Sincronizado');
      return true;
    } else {
      updateSyncBadge('synced', 'Nenhum dado remoto');
      return true;
    }
  } catch(error) {
    console.error("Erro ao sincronizar do Firebase:", error);
    updateSyncBadge('error', 'Erro de sincronização');
    return false;
  }
}

async function syncToFirebase() {
  if(!firebaseReady || !db) {
    return false;
  }

  try {
    updateSyncBadge('syncing', 'Enviando...');
    
    await db.ref('palet_app/data').set({
      movs: S.movs,
      est: S.est,
      lastSync: new Date().toISOString()
    });
    
    updateSyncBadge('synced', 'Sincronizado');
    return true;
  } catch(error) {
    console.error("Erro ao sincronizar para Firebase:", error);
    updateSyncBadge('error', 'Erro de envio');
    return false;
  }
}

// Escuta mudanças em tempo real do Firebase
function setupFirebaseListener() {
  if(!firebaseReady || !db) return;

  db.ref('palet_app/data').on('value', (snapshot) => {
    const remoteData = snapshot.val();
    if(remoteData && remoteData.lastSync) {
      const localTime = S.lastSync ? new Date(S.lastSync).getTime() : 0;
      const remoteTime = new Date(remoteData.lastSync).getTime();
      
      if(remoteTime > localTime) {
        S = { ...S, ...remoteData };
        save();
        renderScreen(getCurrentScreen());
        updateSyncBadge('synced', 'Atualizado do servidor');
      }
    }
  }, (error) => {
    console.error("Erro no listener Firebase:", error);
    updateSyncBadge('error', 'Desconectado');
  });
}

// ═══════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════

function updateSyncBadge(status = 'synced', text = 'Sincronizado') {
  const badge = document.getElementById('sync-badge');
  if(!badge) return;
  
  badge.className = `sync-badge ${status}`;
  const textEl = badge.querySelector('#sync-text');
  if(textEl) textEl.textContent = text;
}

function toast(msg, type = 'info') {
  const container = document.querySelector('.toast-container') || (() => {
    const el = document.createElement('div');
    el.className = 'toast-container';
    document.body.appendChild(el);
    return el;
  })();
  
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  
  setTimeout(() => toast.remove(), 3000);
}

function switchLoginTab(tab) {
  document.getElementById('area-login').style.display = tab === 'area' ? 'block' : 'none';
  document.getElementById('loja-login').style.display = tab === 'loja' ? 'block' : 'none';
  
  document.querySelectorAll('.login-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'area') || (i === 1 && tab === 'loja'));
  });
}

function navigate(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
  
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.target.closest('.nav-item')?.classList.add('active');
  
  const titles = {
    dashboard: 'Dashboard',
    estoque: 'Estoque',
    movimentacoes: 'Movimentações',
    configuracoes: 'Configurações'
  };
  
  document.getElementById('page-title').textContent = titles[screen] || 'PaletCD';
  
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mob-overlay').classList.remove('open');
}

function loginArea() {
  const pwd = document.getElementById('la-pwd').value;
  if(pwd === SENHAS.area) {
    S.user = 'Gestor';
    S.role = 'Área';
    startApp();
  } else {
    showLoginError('Senha incorreta');
  }
}

function loginLoja() {
  const pwd = document.getElementById('ll-pwd').value;
  const loja = document.getElementById('ll-loja').value;
  if(pwd === SENHAS.loja) {
    S.user = `Loja ${loja}`;
    S.role = 'Loja';
    startApp();
  } else {
    showLoginError('Senha incorreta');
  }
}

function showLoginError(msg) {
  const err = document.getElementById('login-error');
  err.textContent = msg;
  err.style.display = 'block';
  setTimeout(() => err.style.display = 'none', 3000);
}

function logout() {
  if(confirm('Deseja sair?')) {
    S = { movs: [], est: {}, user: null, role: null };
    localStorage.clear();
    location.reload();
  }
}

async function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  document.getElementById('user-name').textContent = S.user;
  document.getElementById('user-role').textContent = S.role;
  
  load();
  
  // Inicializa Firebase
  await initFirebase();
  
  if(firebaseReady) {
    setupFirebaseListener();
    syncFromFirebase();
    setInterval(syncToFirebase, 30000);
  } else {
    toast('Firebase offline: usando sincronização local', 'warn');
  }
}

function getCurrentScreen() {
  return document.querySelector('.screen.active')?.id || 'dashboard';
}

function renderScreen(screen) {
  // Renderizar conteúdo específico de cada tela
  if(screen === 'dashboard') {
    document.querySelector('#dashboard p').textContent = `Usuário: ${S.user} | Total de movimentações: ${S.movs?.length || 0}`;
  }
}

function forceSyncFirebase() {
  toast('Sincronizando com Firebase...', 'info');
  syncToFirebase().then(ok => {
    toast(ok ? 'Sincronizado com sucesso!' : 'Erro na sincronização', ok ? 'success' : 'error');
  });
}

function updateClock() {
  const el = document.getElementById('top-clock');
  if(el) el.textContent = new Date().toLocaleTimeString('pt-BR');
}

// ═══════════════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════════════

document.getElementById('menu-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mob-overlay').classList.toggle('open');
});

document.getElementById('mob-overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mob-overlay').classList.remove('open');
});

document.getElementById('la-pwd').addEventListener('keydown', e => {
  if(e.key === 'Enter') loginArea();
});

document.getElementById('ll-pwd').addEventListener('keydown', e => {
  if(e.key === 'Enter') loginLoja();
});

// Populate lojas
(function() {
  const sel = document.getElementById('ll-loja');
  LOJAS_BASE.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.d;
    opt.textContent = `${String(l.d).padStart(3, '0')} · ${l.n}`;
    sel.appendChild(opt);
  });
})();

// Aguarda Firebase estar pronto na inicialização
initFirebase().then(ok => {
  if(ok) {
    updateSyncBadge('synced', 'Pronto para sincronizar');
    console.log("Firebase pronto!");
  } else {
    console.warn("Modo offline: sincronização local ativada");
    updateSyncBadge('syncing', 'Modo offline (localStorage)');
  }
});
</script>
</body>
</html>
